<svg xmlns="http://www.w3.org/2000/svg" width="580" height="720" viewBox="0 0 580 720" role="img" aria-labelledby="title desc">
<title id="title">Professional photo placeholder</title>
<desc id="desc">Abstract silhouette placeholder. Replace this file with your own professional portrait.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b45"/><stop offset="1" stop-color="#070d18"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20ddf5"/><stop offset="1" stop-color="#4285ff"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8cb9d9" stroke-opacity=".1"/></pattern>
</defs>
<rect width="580" height="720" fill="url(#bg)"/><rect width="580" height="720" fill="url(#grid)"/>
<circle cx="290" cy="245" r="135" fill="#20ddf5" fill-opacity=".06"/>
<circle cx="290" cy="245" r="108" fill="none" stroke="url(#glow)" stroke-opacity=".65" stroke-width="2"/>
<circle cx="290" cy="208" r="58" fill="#9db7ce" fill-opacity=".78"/>
